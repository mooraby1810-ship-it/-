<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>الحروف الأبجدية</title>
<style>
    body {
        background-color: #f0f8ff;
        font-family: Arial;
        margin: 0;
    }

    header {
        background-color: #176b87;
        color: white;
        text-align: center;
        padding: 25px;
    }

    nav {
        background-color: #064663;
        padding: 15px;
        text-align: center;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin: 15px;
    }

    section {
        text-align: center;
        padding: 30px 15px;
    }

    .letters {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        width: 100%;
        box-sizing: border-box;
        margin: 20px auto;
    }

    .letter {
        background-color: white;
        border: 2px solid #176b87;
        border-radius: 12px;
        width: 180px;
        padding: 12px;
        box-sizing: border-box;
        text-align: center;
        box-shadow: 0 2px 8px #ccc;
    }

    .letter img {
        width: 100%;
        height: 150px;
        object-fit: contain;
        display: block;
    }

    .letter h2 {
        color: #176b87;
        font-size: 30px;
        margin: 10px 0;
    }

    @media (max-width: 600px) {
        .letter {
            width: 140px;
        }
    }
</style>
</head>
