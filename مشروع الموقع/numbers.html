<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>الأرقام بلغة الإشارة</title>

    <style>
        body {
            background-color: #f0f8ff;
            font-family: Arial;
            margin: 0;
        }

        header {
            background-color: #176b87;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background-color: #064663;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        section {
            text-align: center;
            padding: 30px;
        }

        .numbers {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .number {
            background-color: white;
            border: 2px solid #176b87;
            border-radius: 12px;
            width: 120px;
            padding: 20px;
            transition: 0.3s;
        }

        .number:hover {
            background-color: #e0f7fa;
            transform: translateY(-5px);
        }

        .number h2 {
            color: #176b87;
            font-size: 40px;
        }
    </style>
</head>

<body>

<header>
    <h1>الأرقام بلغة الإشارة 🔢</h1>
    <p>تعلم الأرقام بطريقة سهلة وممتعة</p>
</header>

<nav>
    <a href="index.html">الرئيسية</a>
    <a href="sign.html">الإشارات</a>
    <a href="letters.html">الحروف</a>
</nav>


<section>
    <h2>تعلم الأرقام من 1 إلى 10</h2>
    <p>تعرف على الأرقام وتدرب على حفظها.</p>

    <div class="numbers">

        <div class="number">
            <h2>١</h2>
            <img src="images/number_1.png" alt="إشارة رقم واحد">
            <p>واحد</p>
        </div>

        <div class="number">
            <h2>٢</h2>
            <img src="images/number_2.png" alt="إشارة رقم اثنين">
            <p>اثنان</p>
        </div>

        <div class="number">
            <h2>٣</h2>
            <img src="images/number_3.png" alt="إشارة رقم ثلاثة">
            <p>ثلاثة</p>
        </div>

        <div class="number">
            <h2>٤</h2>
            <img src="images/number_4.png" alt="إشارة رقم أربعة">
            <p>أربعة</p>
        </div>

        <div class="number">
            <h2>٥</h2>
            <img src="images/number_5.png" alt="إشارة رقم خمسة">
            <p>خمسة</p>
        </div>

        <div class="number">
            <h2>٦</h2>
            <img src="images/number_6.png" alt="إشارة رقم ستة">
            <p>ستة</p>
        </div>

        <div class="number">
            <h2>٧</h2>
            <img src="images/number_7.png" alt="إشارة رقم سبعة">
            <p>سبعة</p>
        </div>

        <div class="number">
            <h2>٨</h2>
            <img src="images/number_8.png" alt="إشارة رقم ثمانية">
            <p>ثمانية</p>
        </div>

        <div class="number">
            <h2>٩</h2>
            <img src="images/number_9.png" alt="إشارة رقم تسعة">
            <p>تسعة</p>
        </div>

        <div class="number">
            <h2>١٠</h2>
            <img src="images/number_10.png" alt="إشارة رقم عشرة">
            <p>عشرة</p>
        </div>

    </div>
</section>

</div>
</section>

</body>
</html>
