<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>تعلم لغة الإشارة</title>

    <style>
        body {
            background-color: #f0f8ff;
            font-family: Arial;
            margin: 0;
        }

        header {
            background-color: #176b87;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background-color: #064663;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        section {
            text-align: center;
            padding: 30px;
        }

        .card {
            background-color: white;
            border: 2px solid #176b87;
            border-radius: 12px;
            padding: 20px;
            margin: 10px;
            display: inline-block;
            width: 35%;
            box-sizing: border-box;
        }

        .card img {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }
    </style>
</head>

<body>

<header>
    <h1>تعلم لغة الإشارة 🤟</h1>
    <p>تعلم الإشارات الأساسية بسهولة</p>
</header>

<nav>
    <a href="index.html">الرئيسية</a>
    <a href="sign.html">الإشارات</a>
</nav>

<section>
    <h2>الإشارات اليومية</h2>
    <p>تعلم بعض الإشارات التي تساعدك على التواصل مع الآخرين.</p>

    <div class="card">
        <h3>مرحباً</h3>
        <img src="images/hello.png" alt="إشارة مرحباً">
        <p>إشارة الترحيب بالآخرين.</p>
    </div>

    <div class="card">
        <h3>شكراً</h3>
        <img src="images/thanks.png" alt="إشارة شكراً">
        <p>إشارة للتعبير عن الامتنان.</p>
    </div>

    <div class="card">
        <h3>من فضلك</h3>
        <img src="images/please.png" alt="إشارة من فضلك">
        <p>إشارة لطلب المساعدة بأدب.</p>
    </div>

    <div class="card">
        <h3>كيف حالك؟</h3>
        <img src="images/howareyou.png" alt="إشارة كيف حالك">
        <p>إشارة للسؤال عن حالة الآخرين.</p>
    </div>

</section>

</body>
</html>
